name: NanoPro Deploy to Render + Store CF Version

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy & Record CF Version
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering Render deploy..."
          # If RENDER_DEPLOY_HOOK_URL secret is set, trigger it
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            echo "Render deploy hook: HTTP $RESULT"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping hook trigger"
            echo "To enable: Add RENDER_DEPLOY_HOOK_URL secret in GitHub repo Settings > Secrets"
            echo "Get your deploy hook from: Render Dashboard > Service > Settings > Deploy Hook"
          fi

      - name: Wait for Render to start deploying
        run: sleep 15

      - name: Verify Render health after deploy
        run: |
          echo "Checking Render health..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://nanopro-studio.onrender.com/api/health")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" -eq "200" ]; then
              echo "SUCCESS: Render is healthy!"
              break
            fi
            sleep 30
          done

      - name: Store deploy info in Upstash for dashboard
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          AUTHOR="${{ github.event.head_commit.author.name }}"
          
          # Store Render deploy info
          RENDER_PAYLOAD="{\"status\":\"DEPLOYED\",\"commit_hash\":\"${COMMIT_SHA:0:7}\",\"commit_message\":\"${COMMIT_MSG:0:80}\",\"author\":\"${AUTHOR}\",\"last_deploy_at\":\"${DEPLOYED_AT}\",\"deploy_id\":\"gh-$(date +%s | tail -c 7)\",\"environment\":\"production\",\"time_ago\":\"just now\"}"
          curl -s -X POST "${{ secrets.UPSTASH_REST_URL }}/set/nanopro_render_deploy" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "\"${RENDER_PAYLOAD}\"" || echo "Upstash store skipped"

          echo "Deploy info stored: ${COMMIT_SHA:0:7} at ${DEPLOYED_AT}"

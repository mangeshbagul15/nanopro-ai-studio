name: NanoPro 24/7 Autonomous Cloud Pipeline Scheduler

on:
  # Scheduled crons disabled 2026-11-18. Manual runs still available below.
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Pipeline Cycle to Execute'
        required: true
        default: 'BOD'
        type: choice
        options:
          - BOD
          - SOD
          - T1
          - FULL_LOAD
          - INCREMENTAL
          - EOD
          - BANK_SEED

jobs:
  cloud-pipeline-orchestrator:
    name: Execute Cloud Pipeline (100% Autonomous - Zero Laptop Dependency)
    runs-on: ubuntu-latest
    steps:
      - name: Determine Operational Cycle
        id: cycle_step
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          CYCLE="${{ github.event.inputs.cycle }}"
          if [ -z "$CYCLE" ]; then
            if [ "$HOUR" -eq "0" ]; then
              CYCLE="BOD"
            elif [ "$HOUR" -eq "2" ]; then
              CYCLE="SOD"
            elif [ "$HOUR" -eq "4" ]; then
              CYCLE="INCREMENTAL"
            elif [ "$HOUR" -eq "12" ]; then
              CYCLE="EOD"
            else
              CYCLE="BOD"
            fi
          fi
          echo "Selected Cycle: $CYCLE"
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT

      - name: Trigger Cloud Pipeline on Render Cloud Server
        run: |
          CYCLE="${{ steps.cycle_step.outputs.cycle }}"
          BASE_URL="https://nanopro-studio.onrender.com"
          CRON_SECRET="${{ secrets.NANOPRO_CRON_SECRET }}"
          echo "Executing Autonomous Cloud Pipeline: $CYCLE via $BASE_URL"
          if [ "$CYCLE" = "FULL_LOAD" ] || [ "$CYCLE" = "INCREMENTAL" ]; then
            RESPONSE=$(curl -s -X POST "$BASE_URL/api/cron/bigquery_to_aws" \
              -H "X-Cron-Secret: $CRON_SECRET" --max-time 300)
          elif [ "$CYCLE" = "BANK_SEED" ]; then
            RESPONSE=$(curl -s -X POST "$BASE_URL/api/cron/bank_core_seed?rows=100&sftp=1" \
              -H "X-Cron-Secret: $CRON_SECRET" --max-time 300)
          else
            RESPONSE=$(curl -s -X POST "$BASE_URL/api/cron/pipeline/$CYCLE" \
              -H "X-Cron-Secret: $CRON_SECRET" --max-time 300)
          fi
          echo "Pipeline Response: $RESPONSE"

      - name: Verification & Health Ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://nanopro-studio.onrender.com/api/health")
          echo "Render Cloud Health Check: HTTP $STATUS"
          if [ "$STATUS" -eq "200" ]; then
            echo "SUCCESS: NanoPro Cloud Lakehouse Pipeline executed successfully without laptop dependence!"
          fi

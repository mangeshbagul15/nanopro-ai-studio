name: NanoPro Bank Source Seed

# The free Render instance (512 MB) cannot import the BigQuery SDK next to the
# running app, so the bank source seed runs on this runner instead.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: 'Rows per table'
        required: true
        default: '100'
      include_sftp:
        description: 'Also push the partner feeds to the SFTP lane'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
      run_chain:
        description: 'Run the full lake chain afterwards (needs SNOWFLAKE_PASSWORD)'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'

jobs:
  seed:
    name: Seed BigQuery + SFTP bank core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed bank source model
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          ARGS="--rows ${{ inputs.rows }}"
          if [ "${{ inputs.include_sftp }}" = "false" ]; then ARGS="$ARGS --no-sftp"; fi
          if [ "${{ inputs.run_chain }}" = "false" ]; then ARGS="$ARGS --no-chain"; fi
          echo "Running seed with: $ARGS"
          python scripts/run_bank_core_seed.py $ARGS

# fly.toml app configuration file for Mangesh Nano Pro AI Studio
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "mangesh-nanopro"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  NODE_ROLE = "CLOUD_FLYIO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

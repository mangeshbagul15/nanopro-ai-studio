# fly.toml app configuration file generated for mangesh-nanopro
app = 'mangesh-nanopro'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ROLE = 'CLOUD_FLYIO'
  PORT = '8000'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
